<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – Messages | Naija Opportunity Hub</title>
<style>
:root{--bg:#f8eec9;--card:#fffdf6;--green:#075b3b;--gold:#c6a24a;--gold-b:#e6d7a3;--text:#1c3026;--muted:#5d6b61;--danger:#a32d2d}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "DM Sans","Segoe UI",system-ui,sans-serif}
.wrap{width:min(1000px,100% - 32px);margin:0 auto;padding:20px 0 60px}
h1{margin:0;font-size:1.5rem;color:var(--green)}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.top a{color:var(--green);font-weight:700}
.card{background:var(--card);border:1px solid var(--gold-b);border-radius:16px;padding:18px;margin-bottom:16px}
input,select,textarea{width:100%;padding:11px 12px;margin:0 0 12px;border:1.5px solid #d9d4bd;border-radius:10px;background:#fff;font:inherit;color:var(--text)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:.85rem;font-weight:700;margin-bottom:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:640px){.row{grid-template-columns:1fr}}
button,.btn{font:inherit;font-weight:800;border-radius:10px;border:1.5px solid var(--gold);background:var(--gold);color:#1d2a20;padding:10px 16px;cursor:pointer}
button.alt{background:#fff;color:var(--green)}button.del{background:#fff;color:var(--danger);border-color:#d9a5a5}
button:disabled{opacity:.6;cursor:not-allowed}
.item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-top:1px solid var(--gold-b)}
.item:first-child{border-top:0}
.item h3{margin:0;font-size:1rem}.item small{color:var(--muted)}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;background:#f3e7bd;font-size:.75rem;font-weight:700;margin-right:6px}
.acts{display:flex;gap:8px;flex:none}
.msg{padding:10px 14px;border-radius:10px;margin:0 0 12px;font-weight:600}
.msg.ok{background:#e4f1e8;color:var(--green)}.msg.err{background:#f6e3e3;color:var(--danger)}
.hide{display:none}
.pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0}.prev{max-width:160px;max-height:90px;border-radius:8px;margin:0 0 12px;display:block;object-fit:cover}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Messages</h1><span><a href="/admin-opportunities.html">Opportunities</a> &nbsp; <a href="/">Back to site</a> &nbsp; <a href="#" id="out" class="hide">Sign out</a></span></div>
  <div id="gate" class="card">Checking your access…</div>
  <div id="app" class="hide">
    <div class="card">
      <div class="row"><div><select id="fstat"><option value="">All messages</option><option value="new">New</option><option value="read">Read</option><option value="replied">Replied</option><option value="spam">Spam</option></select></div><div><input id="q" placeholder="Search name, email or message"></div></div>
      <p id="count" style="margin:0;color:var(--muted)"></p>
    </div>
    <div id="list"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var URL_="https://djxornmwvkauhkcuhgxc.supabase.co",KEY="sb_publishable_EDReCY3JcN4vMuypVfqcMQ_GcTEVuBq";
  var sb=window.NOH_SUPABASE_CLIENT||window.supabase.createClient(URL_,KEY);
  var $=function(i){return document.getElementById(i)},rows=[];
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function gate(h){$("gate").innerHTML=h;$("gate").classList.remove("hide");$("app").classList.add("hide")}
  async function init(){
    var s=await sb.auth.getSession(),u=s.data&&s.data.session&&s.data.session.user;
    if(!u){gate('Please <a href="/auth.html?mode=login&redirect='+encodeURIComponent("/admin-messages.html")+'"><strong>sign in</strong></a> with your admin account.');return}
    $("out").classList.remove("hide");
    var a=await sb.from("admins").select("user_id").eq("user_id",u.id).maybeSingle();
    if(a.error||!a.data){gate("This account ("+esc(u.email)+") is not an admin. Run admin-opportunities.sql in Supabase first.");return}
    $("gate").classList.add("hide");$("app").classList.remove("hide");load();
  }
  async function load(){
    var r=await sb.from("contact_messages").select("*").order("created_at",{ascending:false}).limit(500);
    if(r.error){$("list").innerHTML='<p class="msg err">'+esc(r.error.message)+' (run admin-messages.sql in Supabase)</p>';return}
    rows=r.data||[];render();
  }
  function render(){
    var q=$("q").value.toLowerCase(),st=$("fstat").value;
    var l=rows.filter(function(m){return(!st||m.status===st)&&(!q||((m.name||"")+" "+(m.email||"")+" "+(m.message||"")).toLowerCase().indexOf(q)>-1)});
    var n=rows.filter(function(m){return m.status==="new"}).length;
    $("count").textContent=n+" new · "+rows.length+" total";
    $("list").innerHTML=l.length?l.map(function(m){
      var sub="Re: "+m.subject;
      return'<div class="card"><div class="top" style="margin:0"><strong>'+esc(m.name)+'</strong><span><span class="tag">'+esc(m.status)+'</span><small>'+esc(new Date(m.created_at).toLocaleString())+'</small></span></div>'
      +'<small>'+esc(m.email)+' · '+esc(m.subject)+(m.reference?' · ref: '+esc(m.reference):'')+'</small>'
      +'<p class="pre">'+esc(m.message)+'</p>'
      +'<div class="acts" style="flex-wrap:wrap;margin-top:12px"><a class="btn" href="mailto:'+esc(m.email)+'?subject='+encodeURIComponent(sub)+'" style="text-decoration:none">Reply by email</a>'
      +['read','replied','spam'].filter(function(x){return x!==m.status}).map(function(x){return'<button class="alt" data-s="'+x+'" data-id="'+esc(m.id)+'">Mark '+x+'</button>'}).join("")
      +'<button class="del" data-d="'+esc(m.id)+'">Delete</button></div></div>'
    }).join(""):'<div class="card">No messages.</div>';
  }
  $("q").addEventListener("input",render);$("fstat").addEventListener("change",render);
  $("list").addEventListener("click",async function(e){
    var b=e.target.closest("button");if(!b)return;var r;
    if(b.dataset.s){r=await sb.from("contact_messages").update({status:b.dataset.s}).eq("id",b.dataset.id)}
    else if(b.dataset.d){if(!confirm("Delete this message permanently?"))return;r=await sb.from("contact_messages").delete().eq("id",b.dataset.d)}
    else return;
    if(r&&r.error)alert(r.error.message);else load();
  });
  $("out").addEventListener("click",async function(e){e.preventDefault();await sb.auth.signOut();location.reload()});
  init();
})();
</script>
</body>
</html>
