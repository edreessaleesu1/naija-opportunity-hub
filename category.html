<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8eec9">
<title>Opportunities by Category | Naija Opportunity Hub</title>
<meta name="description" content="Browse scholarships, jobs, internships, fellowships, grants, training and volunteering opportunities for Nigerians.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/naija-opportunity-hub-logo.png">
<style>
:root{--bg:#f8eec9;--card:#fffdf6;--green:#075b3b;--green-d:#033c29;--gold:#c6a24a;--gold-d:#a9822d;--gold-l:#f6edcf;--gold-b:#e6d7a3;--text:#1c3026;--muted:#5d6b61}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--green)}
.wrap{width:min(1120px,100% - 32px);margin:0 auto}
header.site{position:sticky;top:0;z-index:30;background:rgba(255,253,246,.96);border-bottom:1px solid var(--gold-b);backdrop-filter:blur(8px)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--green-d);font-weight:800}
.brand img{width:40px;height:40px;object-fit:contain}
.nav a.home{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--gold-b);border-radius:999px;background:#fff;text-decoration:none;font-weight:700;font-size:.9rem}
.head{padding:30px 0 10px}
.head h1{margin:0 0 4px;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.15;color:var(--green-d)}
.head p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:1px solid var(--gold-b);border-radius:999px;background:#fff;color:var(--text);text-decoration:none;font-weight:700;font-size:.9rem}
.tabs a[aria-current]{background:var(--gold);border-color:var(--gold);color:#1d2a20}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}
.tools input,.tools select{flex:1 1 220px;min-height:46px;padding:0 14px;border:1.5px solid #d9d4bd;border-radius:12px;background:#fffefb;font:inherit;color:var(--text)}
.tools select{flex:0 1 180px}
.count{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--gold-b);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 4px 16px rgba(28,48,38,.07);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(28,48,38,.12)}
.img{position:relative;height:150px;overflow:hidden;background:var(--gold-l);display:grid;place-items:center}
.img .bd{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);object-fit:cover;filter:blur(14px);opacity:.7}
.img .mn{position:relative;z-index:1;width:100%;height:100%;object-fit:contain}
.img .ph{font-size:2.4rem;font-weight:800;color:var(--gold-d)}
.body{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;flex:1}
.body h2{margin:0;font-size:1.02rem;line-height:1.35;color:var(--green-d)}
.body .org{color:var(--muted);font-size:.88rem}
.vt{align-self:flex-start;padding:2px 10px;border:1px solid var(--gold);border-radius:999px;background:var(--gold-l);color:#1d2a20;font-size:.75rem;font-weight:800}
.meta{margin-top:auto;padding-top:8px;font-size:.82rem;font-weight:700;color:var(--gold-d)}
.more{display:block;margin:26px auto 0;min-height:48px;padding:0 28px;border:1.5px solid var(--gold);border-radius:12px;background:var(--gold);color:#1d2a20;font:inherit;font-weight:800;cursor:pointer}
.empty{padding:30px;text-align:center;background:var(--card);border:1px solid var(--gold-b);border-radius:16px}
footer{margin-top:50px;padding:24px 0 34px;border-top:1px solid var(--gold-b);text-align:center;font-size:.9rem}
footer a{display:inline-flex;align-items:center;min-height:40px;padding:0 8px;font-weight:700}
.hide{display:none}
</style>
<style id="noh-cards">.nlist{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:0;padding:0}@media(min-width:760px){.nlist{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}.nrow{min-width:0;position:relative;display:flex;gap:12px;align-items:stretch;padding:10px;background:#fffdf6;border:1px solid #e6d7a3;border-radius:16px;box-shadow:0 3px 12px rgba(28,48,38,.06);transition:transform .15s ease,box-shadow .15s ease}@media(hover:hover){.nrow:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(28,48,38,.12);border-color:#c6a24a}}.nthumb{text-decoration:none;flex:none;position:relative;width:88px;height:88px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#f2d98b,#c6a24a)}.nthumb img{position:absolute;inset:0;width:100%;height:100%}.nthumb .bd{inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);object-fit:cover;filter:blur(12px);opacity:.75}.nthumb .mn{object-fit:contain;z-index:1}.nthumb .nicon{position:relative;z-index:0;font-size:2rem;line-height:1;font-style:normal}.nthumb img.mn~.nicon,.nthumb:has(img.mn) .nicon{visibility:hidden}.nthumb.is-broken .nicon{visibility:visible}.nt-scholarship{background:linear-gradient(135deg,#f6e3a1,#c6a24a)}.nt-job{background:linear-gradient(135deg,#0a6a45,#033c29)}.nt-internship{background:linear-gradient(135deg,#e0c068,#a9822d)}.nt-fellowship{background:linear-gradient(135deg,#2f8a63,#075b3b)}.nt-grant{background:linear-gradient(135deg,#f2d98b,#b8892d)}.nt-training{background:linear-gradient(135deg,#1f7a56,#0a4a33)}.nt-volunteering{background:linear-gradient(135deg,#f3d27a,#d09a3c)}.nt-other{background:linear-gradient(135deg,#e8dfc0,#bfae78)}.nbody{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px;padding-right:2px}.nbody.has-save{padding-right:34px}.ntitle{margin:0;font-size:.98rem;line-height:1.3;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.ntitle a,.ntitle a:hover,.ntitle a:visited{color:#033c29;text-decoration:none;border:0}.ntitle a::after{content:"";position:absolute;inset:0;border-radius:16px}.norg{font-size:.82rem;color:#5d6b61;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nmeta{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:4px}.nchip{display:inline-block;padding:2px 9px;border-radius:99px;background:#f6edcf;border:1px solid #e6d7a3;color:#7a5a12;font-size:.72rem;font-weight:800;line-height:1.5}.nchip.is-soon{background:#fdeceb;border-color:#f1c9c6;color:#9b2c2c}.nchip.is-closed{background:#eceae2;border-color:#d8d4c2;color:#6b6b60}.nsave{position:absolute;z-index:2;top:6px;right:6px;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#a9822d;font-size:1.35rem;line-height:1;cursor:pointer}.nsave:hover{background:#f6edcf}.nsave.is-saved{color:#075b3b}.nsave:focus-visible{outline:2px solid #075b3b;outline-offset:2px}.nmore{display:block;margin:16px auto 0}@media(prefers-reduced-motion:reduce){.nrow{transition:none}}.section-kicker,.kicker,.eyebrow-dark{color:#7a5a12}.section-head p,.category-section-head p,.disclaimer,.disclaimer a,.results-badge,.norg{color:#46564c}.disclaimer a{text-decoration:underline}.category-section-head p{font-size:.9rem}</style>
</head>
<body>
<header class="site"><div class="wrap nav">
  <a class="brand" href="/"><img src="/naija-opportunity-hub-logo.png" alt="" width="40" height="40"><span>Naija Opportunity Hub</span></a>
  <a class="home" href="/">&larr; Home</a>
</div></header>

<main class="wrap">
  <div class="head"><h1 id="title">Opportunities</h1><p id="sub">Loading…</p></div>
  <nav class="tabs" id="tabs" aria-label="Categories"></nav>
  <div class="tools">
    <input id="q" type="search" placeholder="Search this category" aria-label="Search this category">
    <select id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="deadline">Closing soonest</option></select>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <div class="nlist" id="grid"></div>
  <button class="more hide" id="more" type="button">Show more</button>
</main>

<footer><div class="wrap">
  <a href="/">Home</a><a href="/how-we-verify">How we check</a><a href="/contact">Contact</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="#" data-noh-cookie-settings>Cookie settings</a>
</div></footer>

<script>
(function(){
  var URL_="https://djxornmwvkauhkcuhgxc.supabase.co",KEY="sb_publishable_EDReCY3JcN4vMuypVfqcMQ_GcTEVuBq";
  var CATS=[["Scholarship","🎓","Scholarships"],["Job","💼","Jobs"],["Internship","💻","Internships"],["Fellowship","👥","Fellowships"],["Grant","💰","Grants"],["Training","🧑‍🏫","Training"],["Volunteering","💖","Volunteering"]];
  var $=function(i){return document.getElementById(i)},all=[],list=[],shown=0,PAGE=12,generic=new Set();
  function key(v){return String(v||"").toLowerCase().trim().replace(/s$/,"")}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function safe(u){try{var x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:""}catch(e){return ""}}
  var want=new URLSearchParams(location.search).get("c")||"";
  var cur=CATS.find(function(c){return key(c[0])===key(want)||key(c[2])===key(want)})||null;

  function tabs(){
    $("tabs").innerHTML='<a href="/category"'+(cur?'':' aria-current="page"')+'>All</a>'+CATS.map(function(c){
      return'<a href="/category?c='+encodeURIComponent(c[0])+'"'+(cur&&cur[0]===c[0]?' aria-current="page"':'')+'><span aria-hidden="true">'+c[1]+'</span>'+esc(c[2])+'</a>'}).join("");
    var a=$("tabs").querySelector("[aria-current]");if(a&&a.scrollIntoView)a.scrollIntoView({inline:"center",block:"nearest"});
  }
  function title(){
    var t=cur?cur[2]:"All opportunities";
    $("title").textContent=t;document.title=t+" | Naija Opportunity Hub";
    $("sub").textContent=cur?"Latest "+cur[2].toLowerCase()+" for Nigerians, with links to the official source.":"Every published opportunity, newest first.";
  }
  /* ---- Compact opportunity rows (shared helpers) ---- */
  const NR_ICON = { scholarship: "🎓", job: "💼", internship: "💻", fellowship: "👥", grant: "💰", training: "🧑‍🏫", volunteering: "💖", other: "📋" };
  function nrKey(c) { const k = String(c || "").toLowerCase().trim().replace(/s$/, ""); return NR_ICON[k] ? k : "other"; }
  function nrEsc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function nrDeadline(d) {
    if (!d) return { text: "Ongoing", cls: "" };
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d));
    const x = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(d);
    if (isNaN(x)) return { text: "Ongoing", cls: "" };
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const n = Math.round((x - t) / 864e5);
    if (n < 0) return { text: "Closed", cls: "is-closed" };
    if (n === 0) return { text: "Closes today", cls: "is-soon" };
    if (n === 1) return { text: "Closes tomorrow", cls: "is-soon" };
    if (n <= 7) return { text: "Closes in " + n + " days", cls: "is-soon" };
    return { text: "Closes " + x.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }), cls: "" };
  }
  // An image used by more than two listings is a generic source photo, so it is not shown.
  function nrGeneric(items) {
    const c = {}; items.forEach(i => { if (i.image_url) c[i.image_url] = (c[i.image_url] || 0) + 1; });
    const s = new Set(); Object.keys(c).forEach(u => { if (c[u] > 2) s.add(u); }); return s;
  }
  function nrRow(o, opt) {
    opt = opt || {};
    const k = nrKey(o.category), url = nrEsc(opt.href), id = nrEsc(o.id);
    const img = o.image_url && !(opt.generic && opt.generic.has(o.image_url)) ? nrEsc(o.image_url) : "";
    const imgs = img
      ? `<img class="bd" src="${img}" alt="" loading="lazy" onerror="this.remove()"><img class="mn" src="${img}" alt="" loading="lazy" onerror="this.parentNode.classList.add('is-broken');this.remove()">`
      : "";
    const dl = nrDeadline(o.deadline);
    const save = opt.save
      ? `<button type="button" class="nsave${opt.saved ? " is-saved" : ""}" data-action="save" data-id="${id}" aria-pressed="${!!opt.saved}" aria-label="${opt.saved ? "Remove from saved" : "Save opportunity"}">${opt.saved ? "♥" : "♡"}</button>`
      : "";
    return `<article class="nrow" data-id="${id}"><a class="nthumb nt-${k}" href="${url}" tabindex="-1" aria-hidden="true">${imgs}<i class="nicon">${NR_ICON[k]}</i></a><div class="nbody${opt.save ? " has-save" : ""}"><h3 class="ntitle"><a href="${url}">${nrEsc(o.title)}</a></h3><div class="norg">${nrEsc(o.organization || "")}</div><div class="nmeta"><span class="nchip ${dl.cls}">${nrEsc(dl.text)}</span></div></div>${save}</article>`;
  }
  function card(o){return nrRow(o,{href:"/opportunity-details?id="+encodeURIComponent(o.id),generic:generic})}
  function apply(){
    var q=$("q").value.toLowerCase().trim();
    list=all.filter(function(o){return(!cur||key(o.category)===key(cur[0]))&&(!q||((o.title||"")+" "+(o.organization||"")).toLowerCase().indexOf(q)>-1)});
    if($("sort").value==="deadline")list.sort(function(a,b){var x=a.deadline||"9999",y=b.deadline||"9999";return x<y?-1:x>y?1:0});
    shown=0;$("grid").innerHTML="";more();
    $("count").textContent=list.length+" "+(list.length===1?"opportunity":"opportunities");
    if(!list.length)$("grid").innerHTML='<div class="empty" style="grid-column:1/-1">Nothing here yet. Try another category or clear your search.</div>';
  }
  function more(){
    var next=list.slice(shown,shown+PAGE);shown+=next.length;
    $("grid").insertAdjacentHTML("beforeend",next.map(card).join(""));
    $("more").classList.toggle("hide",shown>=list.length);
  }
  $("more").addEventListener("click",more);
  var t;$("q").addEventListener("input",function(){clearTimeout(t);t=setTimeout(apply,200)});
  $("sort").addEventListener("change",apply);
  tabs();title();
  fetch(URL_+"/rest/v1/opportunities?select=id,title,organization,category,location,deadline,image_url,verified_at,created_at&status=eq.published&order=created_at.desc&limit=1000",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}})
   .then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){all=Array.isArray(d)?d:[];generic=nrGeneric(all);apply()})
   .catch(function(){$("sub").textContent="We could not load opportunities. Please check your connection and try again."});
})();
</script>
<script defer src="/noh-extras.js?v=1"></script>
<script defer src="/consent.js"></script>
  <script defer src="/noh-scroll.js?v=2"></script>
  <script src="/noh-canonical.js"></script>
</body>
</html>
